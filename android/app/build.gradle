plugins {
    id "com.android.application"
}

android {
    namespace "com.brenninhotools.supermariobros3"
    compileSdk 35
    ndkVersion project.findProperty("smbNdkVersion") ?: "27.2.12479018"

    defaultConfig {
        applicationId "com.brenninhotools.supermariobros3"
        minSdk 26
        targetSdk 35
        versionCode((project.findProperty("smbVersionCode") ?: "1") as Integer)
        versionName project.findProperty("smbVersionName") ?: "1.0.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release"
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["../../external/SDL/android-project/app/src/main/java"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
